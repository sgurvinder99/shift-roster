<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f4c5c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shift Roster"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Delhi / Chennai Shift Roster</title><style>
:root{--ink:#142b35;--muted:#61727a;--paper:#f5f8f8;--navy:#0f4c5c;--accent:#e6f5f4;--border:#d5e1e2}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:calc(18px + env(safe-area-inset-top)) 18px 18px;color:#fff;background:linear-gradient(135deg,#0f4c5c,#19747e)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;opacity:.88;font-size:.9rem}#install{display:none;border:1px solid #cfeef0;border-radius:9px;color:#0f4c5c;background:#fff;font:650 .78rem system-ui,sans-serif;padding:8px 10px}main{max-width:720px;margin:auto;padding:18px 14px 30px}.months{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.month{padding:11px;border:1px solid var(--border);border-radius:10px;color:var(--navy);background:#fff;font:650 1rem system-ui,sans-serif}.month.active{color:#fff;border-color:var(--navy);background:var(--navy)}.selected{padding:15px 16px;margin-bottom:18px;border-radius:14px;background:#fff;box-shadow:0 3px 16px #17364014}.selected h2{margin:0;font-size:1.15rem}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:22px}.dow{text-align:center;color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase}.date{min-height:52px;padding:5px 3px;cursor:pointer;border:1px solid var(--border);border-radius:11px;color:var(--ink);background:#fff;font:inherit;text-align:center}.date small{display:block;color:var(--muted);font-size:.65rem}.date.active{color:#fff;border-color:var(--navy);background:var(--navy);box-shadow:0 3px 9px #0f4c5c55}.date.active small{color:#d8eeee}.date .mini{margin-top:2px;color:#43868c;font-size:.61rem;font-weight:700}.date.active .mini{color:#bfe4e6}.shifts{display:grid;gap:12px}.shift{overflow:hidden;border:1px solid var(--border);border-radius:13px;background:#fff}.shift h3{margin:0;padding:10px 14px;font-size:1rem;background:var(--accent)}.people{min-height:43px;padding:8px 12px 12px}.person{display:inline-block;margin:4px 5px 0 0;padding:6px 10px;border-radius:20px;background:#eef3f4;font-size:.92rem}.empty{color:var(--muted);font-size:.9rem;padding-top:5px}details{margin-top:20px;color:var(--muted);font-size:.86rem}summary{cursor:pointer;color:var(--navy);font-weight:650}.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{padding:3px 7px;border-radius:8px;background:#e9eff0;font-size:.75rem}
</style></head><body><header><div class="bar"><div><h1>Delhi / Chennai Shift Roster</h1><p>September &amp; October 2026</p></div><button id="install" type="button">Install app</button></div></header><main><div class="months"><button class="month" data-month="sep">September 2026</button><button class="month" data-month="oct">October 2026</button></div><section class="selected" aria-live="polite"><h2 id="heading"></h2></section><div class="calendar" id="calendar"></div><section class="shifts" id="shifts"></section><details><summary>Roster key</summary><div class="legend"><span class="tag">A · Morning</span><span class="tag">B · Afternoon</span><span class="tag">C · Night</span><span class="tag">G · General</span><span class="tag">OFF · Off duty</span><span class="tag">CO · Comp off</span></div></details></main><script>
const raw={sep:{label:'September',blanks:2,days:'Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed'.split(' '),roster:[['Sanjeev','G B B OFF G B B B B G OFF A A A A A OFF OFF C C C C C C C OFF OFF OFF OFF OFF'],['Mahtab','C C C C C C C C OFF OFF G B B B B B OFF OFF C A OFF OFF OFF OFF B G A A A A'],['Gurvinder','OFF OFF OFF B OFF J&k G OFF C C C OFF OFF OFF G G B G C A G B B B B C C C C C'],['Nitin Gaur','OFF A A A OFF OFF A A A OFF OFF C C C C C C C A B OFF OFF OFF A A OFF B B B B'],['TBD','- - - - - - - - - - - - - - - - - - - - - - - - - - - - - -'],['Prasath','B B B B A OFF A A A A OFF OFF OFF B B B B B A OFF B A A A A A OFF CO OFF OFF'],['Thiruppathi','A A A A OFF OFF B B B B B B OFF A A A A A OFF OFF CO B B B OFF OFF OFF B B B'],['Antonyraj','OFF G G G B A G OFF OFF G A A OFF OFF OFF G G G B OFF A G G G B B OFF A A A']]},oct:{label:'October',blanks:4,days:'Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat Sun Mon Tue Wed Thu Fri Sat'.split(' '),roster:[['Sanjeev','B B C C C C C OFF A A OFF A A OFF OFF B B B OFF OFF B B B OFF OFF A A A OFF OFF C'],['Mahtab','OFF A B B B B B B B B B OFF OFF OFF OFF OFF C C C C C C C C A OFF OFF OFF A B B'],['Gurvinder','C C OFF OFF OFF A A A OFF OFF A B B B B C OFF OFF OFF B OFF A A A C C C C C C OFF'],['Nitin Gaur','A A A A OFF OFF OFF C C C C C C C C OFF OFF A A A OFF OFF OFF B B B B B B OFF OFF'],['TBD','- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -'],['Prasath','OFF B B OFF B B B B B OFF OFF CO OFF A A A A OFF A A A A CO OFF OFF B B B B B B'],['Thiruppathi','A A OFF OFF CO A A A A A OFF B B B B B B OFF OFF OFF B B B B OFF OFF OFF A A A A'],['Antonyraj','B G A OFF A G G OFF OFF B OFF A A G G G OFF OFF B B G G A A OFF A A G CO OFF OFF']]}};const months={};for(const[k,m]of Object.entries(raw))months[k]={...m,staff:m.roster.map(([name,shifts])=>({name,shifts:shifts.split(' ')}))};const groups=[['A · Morning','A'],['B · Afternoon','B'],['C · Night','C'],['G · General','G']],calendar=document.querySelector('#calendar'),shifts=document.querySelector('#shifts');let chosen='oct';function render(day=1){const m=months[chosen];document.querySelectorAll('.month').forEach(b=>b.classList.toggle('active',b.dataset.month===chosen));calendar.innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(m.blanks);for(let n=1;n<=m.days.length;n++){const count=m.staff.filter(s=>['A','B','C','G'].includes(s.shifts[n-1])).length;calendar.insertAdjacentHTML('beforeend',`<button class="date ${n===day?'active':''}" data-day="${n}">${n}<small>${m.days[n-1]}</small><span class="mini">${count} working</span></button>`)}show(day)}function show(day){const m=months[chosen];document.querySelectorAll('.date').forEach(b=>b.classList.toggle('active',+b.dataset.day===day));document.querySelector('#heading').textContent=`${m.days[day-1]}, ${String(day).padStart(2,'0')} ${m.label} 2026`;shifts.innerHTML=groups.map(([title,code])=>{const names=m.staff.filter(s=>s.shifts[day-1]===code).map(s=>`<span class="person">${s.name}</span>`).join('');return `<article class="shift"><h3>${title}</h3><div class="people">${names||'<span class="empty">No one scheduled</span>'}</div></article>`}).join('')}document.querySelector('.months').addEventListener('click',e=>{const b=e.target.closest('.month');if(b){chosen=b.dataset.month;render()}});calendar.addEventListener('click',e=>{const b=e.target.closest('.date');if(b)show(+b.dataset.day)});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');let prompt;const install=document.querySelector('#install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;install.style.display='block'});install.addEventListener('click',async()=>{if(!prompt)return;prompt.prompt();await prompt.userChoice;prompt=null;install.style.display='none'});
</script></body></html>
